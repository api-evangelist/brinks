description: >-
  Brink's publishes no API rate limits anywhere on its public surface. The 2026-09-04 enrichment
  pass searched us.brinks.com (143 sitemap URLs), brinkscompleteus.com, brinksglobal.com,
  blubeempayments.com and the 24SEVEN customer portal at customerportal.brinksinc.com and found no
  developer documentation of any kind — no rate-limit table, no throttling policy, and no documented
  response headers. There is no public API to rate-limit.
