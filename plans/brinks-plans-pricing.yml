specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Brinks
providerId: brinks
created: '2026-05-04'
generated: '2026-09-04'
method: searched
source: https://blubeempayments.com/the-basics/pricing
modified: '2026-09-04'
reconciled: false
tags:
  - Cash Management
  - Security
  - ATM Services
  - Financial Services
  - Armored Transport
description: >-
  Brink's sells cash management, armored transport, ATM and vault services under bilateral commercial
  contracts, and publishes no price for any of them — every Brink's Complete, 24SEVEN, RetailBox and
  Brink's Global Services page routes to "Get a Quote". The one exception found on 2026-09-04 is
  BLUbeem by Brink's, the company's digital cash payment product for small merchants (distributed via
  the Clover and Square app markets), which publishes a real headline price on its own site. There is
  no API price of any kind, because Brink's publishes no API.
plan_count: 2
currency: USD
sources:
  - https://blubeempayments.com/the-basics/pricing
  - https://us.brinks.com/get-a-quote
  - https://us.brinks.com/total-cash-management
notes: >-
  The BLUbeem figures are transcribed verbatim from the provider's own pricing page, which labels the
  displayed values estimates and adds "Minimums Apply" without stating the minimum. The enterprise
  entry is a description of the commercial motion, not a published price — Brink's states no number
  for it anywhere public. Reconcile the enterprise line against the customer's master services
  agreement.
plans:
  - id: blubeem
    name: BLUbeem by Brink's
    type: published
    method: searched
    source: https://blubeempayments.com/the-basics/pricing
    price: 99
    currency: USD
    period: month
    price_note: '$99 fixed monthly fee'
    overage: 0.99% fee based on cash volume
    included_quota: not stated
    limits:
      minimums: 'stated as "Minimums Apply"; the minimum itself is not published'
    caveat: >-
      The provider labels the displayed values estimates and directs buyers to "Connect with us" for
      detailed pricing.
    description: >-
      Digital cash payment and reconciliation for merchants, with next-business-day settlement on
      cash deposits, smart safe hardware, a mobile analytics app and point-of-sale integration.
      Distributed through the Clover and Square app markets.
    elements:
      - name: Cash digitization / smart safe deposit
      - name: Next-business-day settlement
      - name: BLUbeem mobile app (analytics + reconciliation)
      - name: Clover / Square POS integration
      - name: Change delivery
  - id: brinks-enterprise
    name: Enterprise / Contracted Service
    type: enterprise
    method: derived
    source: https://us.brinks.com/get-a-quote
    price: contact sales
    currency: USD
    period: contract
    description: >-
      Custom commercial agreement covering 24SEVEN ACCESS portal access, Brink's Armored Account,
      RetailBox, Brink's Money paycard, cash-in-transit and vault services. Pricing is bundled with
      logistics and hardware and is quoted per customer on locations, pickup frequency and cash
      volume. Brink's publishes no figure for any of it.
    entries:
      - label: Service contract
        name: service_contract
        type: subscription
        metric: month
        limit: 1
        timeFrame: month
        geo: configurable
        unit: 1
        price: contact sales
        userMultiplied: false
      - label: Per-pickup / per-deposit
        name: per_pickup
        type: metered
        metric: event
        limit: -1
        timeFrame: usage
        geo: configurable
        unit: 1
        price: see services agreement
        userMultiplied: false
    elements:
      - name: 24SEVEN ACCESS Portal
      - name: Brink's Armored Account
      - name: RetailBox
      - name: Brink's Money Paycard
      - name: Total Cash Management Platform
